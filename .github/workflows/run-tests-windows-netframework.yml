name: "Unit and Integration Test: Windows (NetFramework)"
on:
  pull_request:
  push:
    branches:
      - main
      - 'integration/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Download dotnet framework
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            7.0.410
            
      - name: Download dotnet build-script tools
        run: dotnet tool restore

      - name: Unit tests
        run: ./build.cmd --target=Test.NetFramework.Unit.WithRetry

      - name: Integration tests
        run: ./build.cmd --target=Test.NetFramework.Integration.WithRetry

      # Packs all three packages at the committed version and runs the package-install test
      # against them: small .NET Framework (net462, net48) and .NET (net6.0, net7.0) apps
      # install the packages the way a customer would, and the .NET Framework apps run on the
      # .NET Framework CLR. Offline: no credentials. Last, because Package cleans and rebuilds
      # the solution in the signed Package configuration.
      - name: Package-install test (.NET Framework CLR)
        run: |
          $match = Select-String -Path src/CommonAssemblyInfo.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
          if (-not $match) { throw "No AssemblyInformationalVersion in src/CommonAssemblyInfo.cs" }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Version under test: $version"
          ./build.cmd -- --target=Test.PackageConsumption "--version=$version" --packageOutput=consumption-packages
