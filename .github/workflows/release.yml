# ============================================================================
# RELEASE: publishes Ably.PubSub.Core, .Device and .Server to nuget.org, then
# tags the release and creates the GitHub release with the .unitypackage.
#
#   gh workflow run release.yml --ref main -f version=2.0.1 -f dry_run=true
#   gh workflow run release.yml --ref main -f version=2.0.1 -f dry_run=false
#
# Don't break:
# - The file name. nuget.org Trusted Publishing trusts only release.yml, and only
#   a NuGet/login in this file, in a job with environment `nuget`.
# - The `version` input's name. package.yml, called by `pack`, reads
#   github.event.inputs.version.
#
# The checks are in cake-build/release.cake ("Release targets" in cake-build/README.md).
# If a run fails, see "If something goes wrong" in CONTRIBUTING.md: usually "Re-run
# failed jobs" on the same run.
# ============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      # Keep the name `version`: package.yml reads github.event.inputs.version.
      version:
        description: 'Version to release, e.g. 2.0.1. Must equal the top CHANGELOG.md entry and the committed version files on main.'
        required: true
        type: string
      dry_run:
        description: 'Check, pack and test only. Push nothing, create no tag or release.'
        required: true
        type: boolean
        default: true

permissions: {}

# One real release at a time, never cancelled (a cancelled publish can leave Core
# without the doors). Each dry run gets its own group.
concurrency:
  group: ${{ inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release-nuget' }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  prechecks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # A failing step, not a job-level `if:`, so a wrong ref fails the run instead of skipping it.
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml only runs on main (dispatched on $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The repo's .NET 6 baseline; global.json (rollForward: latestMajor) may pick a newer preinstalled SDK.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 6.0.428

      - name: Restore the Cake tool
        run: dotnet tool restore

      # On a dry run, "already on nuget.org, tagged or released" only warns.
      - name: Check the version, CHANGELOG.md, and that it isn't released yet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet cake cake-build/release.cake -- --target=Release.Preflight "--version=$VERSION" "--dryRun=$DRY_RUN"

  pack:
    needs: prechecks
    # A called workflow can only narrow the token it is given: this grants package.yml's contents: read.
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}

  plan:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: output-package
          path: output-package

      # The repo's .NET 6 baseline; global.json (rollForward: latestMajor) may pick a newer preinstalled SDK.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 6.0.428

      - name: Restore the Cake tool
        run: dotnet tool restore

      - name: Extract the release notes
        run: dotnet cake cake-build/release.cake -- --target=Release.Notes "--version=$VERSION" --output=release-notes/release-notes.md

      # overwrite: re-running this job replaces the notes with the same content.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes/release-notes.md
          if-no-files-found: error
          overwrite: true

      - name: Summarise the release
        run: |
          {
            echo "### Release $VERSION ($([ "$DRY_RUN" = true ] && echo 'DRY RUN' || echo 'REAL'))"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "Push order: Ably.PubSub.Core, wait for nuget.org, then Ably.PubSub.Device and Ably.PubSub.Server."
            echo
            echo '<pre>'
            (cd output-package && sha256sum -- *)
            echo '</pre>'
            echo
            echo '<details><summary>Release notes</summary>'
            echo
            cat release-notes/release-notes.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Unity package contents
        run: dotnet cake cake-build/release.cake -- --target=Release.VerifyUnityPackage "--version=$VERSION" "--unityPackage=output-package/ably.pubsub.$VERSION.unitypackage"

  # The only job that can get a NuGet key: no checkout, no repository code.
  publish:
    needs: [prechecks, pack, plan]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Must match the policy. Its required reviewers approve before the job starts.
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: output-package
          path: output-package

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # NUGET_USER: the nuget.org username of the policy's creator, not ably-realtime.
      - name: NuGet login for Core (OIDC -> short-lived API key)
        id: login-core
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The doors pin Core exactly, so Core goes first. --skip-duplicate makes re-runs safe.
      - name: Push Ably.PubSub.Core
        env:
          NUGET_API_KEY: ${{ steps.login-core.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "output-package/Ably.PubSub.Core.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A door can't be restored until nuget.org serves its exact Core version.
      - name: Wait for Ably.PubSub.Core on nuget.org
        run: |
          url="https://api.nuget.org/v3-flatcontainer/ably.pubsub.core/index.json"
          deadline=$((SECONDS + 30*60))
          until curl -fsS --max-time 30 "$url" 2>/dev/null | jq -e --arg v "${VERSION,,}" '.versions | index($v)' >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::Ably.PubSub.Core $VERSION isn't on nuget.org after 30 minutes. Nothing else was pushed. Check its validation status on nuget.org, then use 'Re-run failed jobs': the Core push is skipped and the doors go out."
              exit 1
            fi
            echo "Waiting for Ably.PubSub.Core $VERSION ..."; sleep 20
          done
          echo "Ably.PubSub.Core $VERSION is available."

      # A fresh key: the first lasts an hour and may expire during the wait.
      - name: NuGet login for the doors
        id: login-doors
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push Ably.PubSub.Device and Ably.PubSub.Server
        env:
          NUGET_API_KEY: ${{ steps.login-doors.outputs.NUGET_API_KEY }}
        run: |
          for id in Ably.PubSub.Device Ably.PubSub.Server; do
            dotnet nuget push "output-package/$id.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Wait for the doors on nuget.org (warning only)
        run: |
          deadline=$((SECONDS + 15*60))
          for id in ably.pubsub.device ably.pubsub.server; do
            until curl -fsS --max-time 30 "https://api.nuget.org/v3-flatcontainer/$id/index.json" 2>/dev/null \
              | jq -e --arg v "${VERSION,,}" '.versions | index($v)' >/dev/null; do
              if (( SECONDS >= deadline )); then
                echo "::warning::$id $VERSION not yet visible on nuget.org; check later."; break
              fi
              sleep 20
            done
          done

      - name: Recovery notes
        if: ${{ failure() || cancelled() }}
        run: |
          {
            echo "### Publishing $VERSION failed"
            echo "- Use **Re-run failed jobs** on this run. Every push uses --skip-duplicate, so packages already on nuget.org are skipped."
            echo "- Don't dispatch a new run for $VERSION: the pre-checks refuse a version that is already partly on nuget.org."
            echo "- To abandon $VERSION, unlist Ably.PubSub.Server and Ably.PubSub.Device first, then Ably.PubSub.Core. See \"Withdrawing a version\" in CONTRIBUTING.md."
          } >> "$GITHUB_STEP_SUMMARY"

  # Has a write token, so no checkout: it works from the run's artifacts only.
  github-release:
    needs: publish
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: output-package
          path: output-package

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: release-notes

      - name: Create the annotated tag
        run: |
          set -euo pipefail
          remote="$GITHUB_SERVER_URL/$GH_REPO.git"
          # The ^{} line is the commit an annotated tag points at; a lightweight tag only has the plain line.
          existing=$(git ls-remote "$remote" "refs/tags/$VERSION^{}" | cut -f1)
          [ -n "$existing" ] || existing=$(git ls-remote "$remote" "refs/tags/$VERSION" | cut -f1)
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $VERSION exists at $existing, not at the released commit $GITHUB_SHA."; exit 1
            fi
            echo "Tag $VERSION already points at $GITHUB_SHA."; exit 0
          fi
          tag_object=$(gh api "repos/$GH_REPO/git/tags" \
            -f tag="$VERSION" -f object="$GITHUB_SHA" -f type=commit \
            -f message="Ably.PubSub.Core, Ably.PubSub.Device and Ably.PubSub.Server $VERSION" \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$tag_object" >/dev/null
          echo "Created annotated tag $VERSION -> $GITHUB_SHA"

      # No --clobber: a re-run uploads only a missing asset, which also suits immutable releases.
      - name: Create the GitHub release and attach the Unity package
        run: |
          set -euo pipefail
          name="ably.pubsub.$VERSION.unitypackage"
          asset="output-package/$name"
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease --latest=false) ;; esac
          if gh release view "$VERSION" --json isDraft,assets > release.json 2>/dev/null; then
            if ! jq -e --arg n "$name" '[.assets[].name] | index($n)' release.json >/dev/null; then
              gh release upload "$VERSION" "$asset"
            fi
            if [ "$(jq -r .isDraft release.json)" = true ]; then
              gh release edit "$VERSION" --draft=false "${flags[@]}"
            fi
            echo "Release $VERSION already existed; it now has $name and is published."
          else
            gh release create "$VERSION" "$asset" --verify-tag --title "$VERSION" \
              --notes-file release-notes/release-notes.md "${flags[@]}"
          fi
